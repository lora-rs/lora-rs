name: HIL bench

on:
  workflow_dispatch:
  push:
    branches: [hil-tests]
  pull_request:
    branches: [hil-tests]

concurrency:
  group: hil-bench
  cancel-in-progress: false

jobs:
  paired-scenarios:
    runs-on: [self-hosted, lora-hil]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run paired HIL scenarios
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export HIL_FW_OFFLINE=0
          export CARGO_TARGET_DIR=/tmp/hil-target
          # Rig marker lives on the bench (read-only mount), not in the repo:
          # its presence is what marks this runner as rig-attached. The suite
          # itself now comes from the checkout, like tests-hil-fw always has.
          export BANC_RIG=/bench/lora-hil-harness/banc-rig.toml
          cd "$GITHUB_WORKSPACE/hil-test/tests-hil"
          # One DUT at a time: both suites drive the same gateway and bind
          # :1730, so they run sequentially in a single job. scenarios = the
          # WL55 DUT, scenarios_l072 = the B-L072Z (SX1276).
          cargo test --locked --test scenarios -- --test-threads 1
          cargo test --locked --test scenarios_l072 -- --test-threads 1
