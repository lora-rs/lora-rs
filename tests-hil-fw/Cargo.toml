[package]
edition = "2021"
name = "lora-hil-fw-tests"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "On-target HIL tests for lorawan-device, run via embedded-test + probe-rs against the bench gateway"

[dependencies]
embassy-stm32 = { version = "0.2.0", features = [
    "defmt",
    "stm32wle5jc",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
] }
# Must match embassy-stm32 0.2's timer-queue executor (task_from_waker is
# version-locked); embedded-test runs on it via external-executor.
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
embassy-futures = { version = "0", features = ["defmt"] }

lora-phy = { path = "../lora-phy", features = ["lorawan-radio", "defmt-03"] }
lorawan-device = { path = "../lorawan-device", features = [
    "embassy-time",
    "defmt-03",
] }

defmt = "0.3"
defmt-rtt = "0.4"
# NOTE: no panic-probe here; embedded-test provides the panic handler
# (semihosting abort). defmt-rtt is still needed as the defmt sink.
# 0.6.x is the embedded-test line that matches embassy-executor 0.7
# (which embassy-stm32 0.2's timer queue is version-locked to).
embedded-test = { version = "0.6.2", features = ["embassy", "defmt"] }
semihosting = "0.1"

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }
embedded-hal-bus = { version = "0.2.0", features = ["async"] }

[lib]
test = false
harness = false

[[test]]
name = "join"
harness = false

[profile.release]
debug = 2
