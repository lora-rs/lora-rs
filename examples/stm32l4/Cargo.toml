# Examples for the Semtech LR1110 development kit: an LR1110MB1DxS shield
# (LR1110DVK1TxKS kits) seated on a NUCLEO-L476RG's Arduino headers.
[package]
edition = "2024"
name = "lora-stm32l4-lr1110-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32l476rg",
    "time-driver-any",
    "exti",
    "memory-x",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

lora-phy = { path = "../../lora-phy", features = ["lorawan-radio", "defmt-03"] }
lorawan-device = { path = "../../lorawan-device", features = [
    "embassy-time",
    "defmt-03",
] }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

[profile.release]
debug = 2
